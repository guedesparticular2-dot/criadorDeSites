name: baixada

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./infra/secrets/postgres.env
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=5min
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - wal_archive:/var/lib/postgresql/wal_archive
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: infra/docker/migrate.Dockerfile
    restart: "no"
    env_file:
      - ./infra/secrets/migrator.env
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    env_file:
      - ./infra/secrets/web.env
    volumes:
      - media_data:/data/uploads
    ports:
      # Temporary, private bootstrap access via SSH tunnel; keep loopback-only.
      - "127.0.0.1:13002:3000"
    networks:
      database: {}
      servicos-padrao:
        aliases:
          - baixada-web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    env_file:
      - ./infra/secrets/worker.env
    volumes:
      - media_data:/data/uploads
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy

networks:
  database:
    internal: true
  servicos-padrao:
    external: true
    name: servicos-padrao

volumes:
  postgres_data:
  media_data:
  wal_archive:
